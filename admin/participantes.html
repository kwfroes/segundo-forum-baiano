<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net https://cdn.sheetjs.com; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://cdn.sheetjs.com; form-action 'self'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Participantes — Credenciamento 2º Fórum Baiano</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/checkin-duplo.css">
  <link rel="stylesheet" href="../css/equipe.css">
</head>
<body class="admin">
  <header id="topo"></header>
  <main class="conteudo-admin">
    <div class="barra-topo">
      <h1>Participantes</h1>
      <div class="grupo">
        <button id="cpf-toggle" class="btn sec" type="button" aria-pressed="false" hidden>Mostrar CPF</button>
        <button id="baixar-csv" class="btn sec" type="button" hidden>Baixar CSV</button>
        <button id="adicionar" class="btn" type="button">+ Adicionar participante</button>
      </div>
    </div>
    <p id="faixa-periodo" class="aviso-periodo" role="status" hidden></p>
    <form id="filtros" class="filtros formulario-admin" novalidate>
      <div><label for="f-busca">Buscar por nome, CPF ou matrícula</label><input id="f-busca" type="search" autocomplete="off" placeholder="Nome, CPF ou matrícula"></div>
      <div><label for="f-secretaria">Secretaria</label><select id="f-secretaria"><option value="">Todas</option></select></div>
      <div><label for="f-orgao">Órgão/unidade</label><select id="f-orgao"><option value="">Todos</option></select></div>
      <div><label for="f-municipio">Município</label><select id="f-municipio"><option value="">Todos</option></select></div>
      <div><label for="f-inscricao">Inscrição</label><select id="f-inscricao"><option value="todas">Todas</option><option value="confirmada" selected>Confirmada</option><option value="nao_confirmada">Não confirmada</option></select></div>
      <div><label for="f-checkin">Check-in</label><select id="f-checkin"><option value="todos">Todos</option><option value="presente">Presente</option><option value="ausente">Ausente</option></select></div>
      <div><label for="f-equipe">Equipe</label><select id="f-equipe"><option value="todos">Todos</option><option value="equipe">Toda a equipe</option><option value="palestrante_painelista">Palestrantes/Painelistas</option><option value="convidado">Convidados</option><option value="estandista">Estandistas</option><option value="producao">Produção</option><option value="participantes">Só participantes</option></select></div>
    </form>
    <div class="tabela-rolavel">
      <table class="dados tabela-acoes" id="tabela">
        <caption class="sr-only">Participantes inscritos</caption>
        <thead id="cabecalho"></thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <p class="legenda-equipe"><span class="amostra-equipe" aria-hidden="true"></span> Linhas em destaque: <strong>equipe do evento</strong> (palestrantes/painelistas, convidados, estandistas e produção). Use o filtro “Equipe” para listar só esse grupo.</p>
    <div class="paginacao">
      <span id="contagem" role="status"></span>
      <span>
        <button id="anterior" class="btn sec pequeno" type="button">Anterior</button>
        <span id="pagina"></span>
        <button id="proxima" class="btn sec pequeno" type="button">Próxima</button>
      </span>
    </div>
  </main>
  <script type="module" src="../js/participantes.js"></script>
</body>
</html>
